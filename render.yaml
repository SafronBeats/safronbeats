services:
  - type: web
    name: safronbeats
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: safron-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PAYPAL_MODE
        value: live
      - key: STORE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: INSTAGRAM_URL
        sync: false
      - key: YOUTUBE_URL
        sync: false
